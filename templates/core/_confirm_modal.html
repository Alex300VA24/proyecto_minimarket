<div x-show="showConfirmModal" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showConfirmModal = false" @keydown.escape.window="showConfirmModal = false" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center" @click.stop>
    <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4" :class="confirmIconBg">
      <i :class="confirmIcon" class="text-xl"></i>
    </div>
    <h3 class="font-display font-700 text-ink-900 mb-2" x-text="confirmTitle"></h3>
    <p class="text-ink-500 text-sm mb-6" x-text="confirmMessage"></p>
    <div class="flex gap-3">
      <button @click="showConfirmModal = false" class="btn-ghost flex-1 py-3 text-sm font-bold"><i class="fa-solid fa-xmark mr-1"></i> Cerrar</button>
      <button @click="handleConfirm()" :class="confirmButtonClass" x-text="confirmButtonText"></button>
    </div>
  </div>
</div>

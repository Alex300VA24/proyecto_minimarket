{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <meta name="user-is-authenticated" content="{{ user.is_authenticated|yesno:'true,false' }}" />
  <meta name="login-url" content="{% url 'login' %}" />
  <link rel=icon type="image/png" href="{% static 'src/images/logo_sin_fondo.png' %}" />
  <title>{% block title %}Minimarket Yumis — Sistema de Pedidos{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/all.min.css' %}" />
  <link rel="stylesheet" href="{% static 'dist/css/app.css' %}" />

  <script defer src="{% static 'dist/js/app.js' %}"></script>

  <style>
    /* === SHARED COMPONENT STYLES === */

    /* Card white with hover lift + glow */
    .prod-card-catalog {
      position: relative;
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 1rem;
      transition: all .35s cubic-bezier(.4,0,.2,1);
      transform: translateY(0);
    }
    .prod-card-catalog::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(37,99,235,.04), rgba(245,158,11,.03));
      opacity: 0;
      transition: opacity .35s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
      z-index: 1;
    }
    .prod-card-catalog:hover {
      transform: translateY(-6px);
      border-color: rgba(59,130,246,.25);
      box-shadow: 0 0 0 1px rgba(59,130,246,.08), 0 0 20px rgba(37,99,235,.1), 0 20px 40px -12px rgba(30,58,138,.15);
    }
    .prod-card-catalog:hover::before { opacity: 1; }

    /* Image zoom on card hover */
    .prod-card-catalog .prod-img-area img {
      transition: transform .4s cubic-bezier(.4,0,.2,1);
    }
    .prod-card-catalog:hover .prod-img-area img {
      transform: scale(1.08);
    }

    /* Price — clean, bold, high-contrast */
    .price-catalog {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -.01em;
    }
    .price-catalog .price-sym {
      font-size: .72em;
      font-weight: 600;
      color: #64748b;
      margin-right: 1px;
    }

    /* Staggered entrance */
    .stagger-in {
      opacity: 0;
      transform: translateY(20px) scale(.98);
      transition: opacity .45s cubic-bezier(.4,0,.2,1), transform .45s cubic-bezier(.4,0,.2,1);
    }
    .stagger-in.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Line clamp */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Out-of-stock badge */
    .badge-agotado {
      position: absolute;
      top: .75rem;
      left: .75rem;
      z-index: 10;
      background: #ef4444;
      color: #fff;
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: .25rem .6rem;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(239,68,68,.3);
    }

    /* Spinner */
    .spinner-catalog {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid #e7e5e4;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* View detail circular arrow button (by default on the right) */
    .view-detail-btn {
      position: absolute;
      bottom: .75rem;
      right: .75rem;
      z-index: 30;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #2563eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      transition: all .3s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      text-decoration: none;
    }
    .view-detail-btn:hover {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 16px rgba(37,99,235,.35);
      transform: scale(1.1);
    }
    /* When the cart button is also on the right, shift arrow to its left */
    .view-detail-btn.shift-left {
      right: 3.75rem;
    }
  </style>

  {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen">
  {% block content %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>

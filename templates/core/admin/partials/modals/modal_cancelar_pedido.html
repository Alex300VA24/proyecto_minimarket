<div x-show="showModalCancelarPedido" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalCancelarPedido = false" @keydown.escape.window="showModalCancelarPedido = false" role="dialog" aria-modal="true" aria-labelledby="modal-cancelar-pedido" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center" @click.stop>
    <div class="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i></div>
    <h3 id="modal-cancelar-pedido" class="text-2xl font-display font-700 text-ink-900 mb-2">Cancelar Pedido</h3>
    <p class="text-ink-500 text-sm mb-2">El pedido <span class="font-semibold text-ink-700" x-text="'#' + (pedidoCancelar?.id || '')"></span> de <span class="font-semibold text-ink-700" x-text="pedidoCancelar?.cliente"></span> será cancelado.</p>
    <div class="mb-4">
      <input x-model="justificacionCancelarPedido" type="text" class="inp" placeholder="Justificación (opcional)" maxlength="200">
    </div>
    <div class="flex gap-3">
      <button @click="confirmarCancelarPedido()" class="btn-danger flex-1 py-3 text-sm font-bold shadow-lg shadow-red-200"><i class="fa-solid fa-xmark"></i> Sí, cancelar</button>
      <button @click="showModalCancelarPedido = false" class="btn-ghost flex-1" aria-label="Cerrar modal"><i class="fa-solid fa-xmark mr-1"></i> No, volver</button>
    </div>
  </div>
</div>

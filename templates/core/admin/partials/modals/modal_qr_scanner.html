<!-- MODAL: Escanear / Digitar QR - Pantalla de espera -->
<div x-show="showModalQRScanner" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalQRScanner = false; stopQRPolling()" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md" @click.stop>
    <div class="flex items-center justify-between p-5 border-b border-ink-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center"><i class="fa-solid fa-qrcode text-green-600"></i></div>
        <div>
          <h3 class="font-display font-700 text-ink-900">Entrega con QR</h3>
          <p class="text-xs text-ink-400" x-text="'Pedido N°' + String((pedidoQR?.id || '')).padStart(5, '0')"></p>
        </div>
      </div>
      <button @click="showModalQRScanner = false; stopQRPolling()" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 space-y-5 text-center" x-show="pedidoQR">

      <!-- Estado listo para entrega -->
      <template x-if="pedidoQR.estado_key === 'ready'">
        <div>
          <!-- QR Code grande apuntando a validar-boleta -->
          <div class="bg-white rounded-xl p-6 border-2 border-dashed border-green-300">
            <p class="text-xs text-ink-400 mb-3">Escanea este QR con el dispositivo del cliente:</p>
            <div class="flex justify-center">
              <img :src="'data:image/png;base64,' + pedidoQR.qr_b64" class="w-48 h-48" alt="QR Validación">
            </div>
            <p class="text-xs text-ink-400 mt-3">
              <i class="fa-regular fa-circle-info"></i>
              El cliente escanea y la boleta se valida automáticamente.
            </p>
          </div>

          <!-- Separador -->
          <div class="flex items-center gap-3 my-2">
            <div class="flex-1 h-px bg-ink-200"></div>
            <span class="text-xs text-ink-400 font-medium">O ingresa código manual</span>
            <div class="flex-1 h-px bg-ink-200"></div>
          </div>

          <!-- Input manual -->
          <div class="bg-ink-50 rounded-xl p-4">
            <label class="text-sm font-medium text-ink-700 block mb-2 text-left">
              <i class="fa-solid fa-keyboard"></i> Código de boleta
            </label>
            <div class="flex gap-2">
              <input type="text" x-model="qrCodigoManual" @keyup.enter="validarCodigoManual()" placeholder="Ej: aB3xK7..." class="w-full px-3 py-2.5 rounded-lg border border-ink-200 text-sm font-mono focus:border-brand-500 focus:ring-2 focus:ring-brand-200 outline-none">
              <button @click="validarCodigoManual()" :disabled="!qrCodigoManual || loadingQRManual" class="btn-primary px-4 py-2.5 text-sm whitespace-nowrap">
                <i x-show="!loadingQRManual" class="fa-solid fa-check"></i>
                <i x-show="loadingQRManual" class="fa-solid fa-spinner fa-spin"></i>
                Validar
              </button>
            </div>
            <p class="text-xs text-ink-400 mt-2 text-left">Digita el código de boleta que aparece en el comprobante del cliente.</p>
          </div>

          <!-- Estado de espera polling -->
          <div x-show="!codigoManualUsado" class="flex items-center justify-center gap-2 mt-2 text-sm text-green-600">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Esperando escaneo o ingreso de código...</span>
          </div>
        </div>
      </template>

      <!-- Estado Pendiente -->
      <template x-if="pedidoQR.estado_key === 'pending'">
        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6">
          <i class="fa-solid fa-clock text-4xl text-yellow-400 mb-3 block"></i>
          <p class="text-yellow-700 font-medium">El pedido aún está pendiente</p>
          <p class="text-xs text-yellow-600 mt-1">Debes marcarlo como "Listo para entregar" primero.</p>
        </div>
      </template>

      <div class="flex gap-2 pt-2">
        <button @click="showModalQRScanner = false; stopQRPolling()" class="btn-secondary flex-1 py-2.5 text-sm">Cerrar</button>
      </div>
    </div>
  </div>
</div>

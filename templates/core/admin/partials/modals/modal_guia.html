<div x-show="showModalGuia" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalGuia = false" @keydown.escape.window="showModalGuia = false" role="dialog" aria-modal="true" aria-labelledby="modal-guia" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" @click.stop>
    <div class="flex items-center justify-between p-5 border-b border-ink-100">
      <h3 id="modal-guia" class="text-2xl font-display font-700 text-ink-900" x-text="guiaTitulo"></h3>
      <button @click="showModalGuia = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400" aria-label="Cerrar modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div class="bg-brand-50 border border-brand-200 rounded-xl p-4">
        <div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-circle-info text-brand-600"></i><span class="font-semibold text-brand-800 text-sm">Guia paso a paso</span></div>
        <div class="space-y-2 text-sm text-ink-700">
          <template x-for="(paso, idx) in guiaPasos" :key="idx">
            <p x-text="(idx + 1) + '. ' + paso"></p>
          </template>
        </div>
      </div>
      <button @click="showModalGuia = false" class="btn-primary w-full" aria-label="Cerrar modal">Entendido</button>
    </div>
  </div>
</div>

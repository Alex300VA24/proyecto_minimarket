<div x-show="showModalBoleta" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalBoleta = false" @keydown.escape.window="showModalBoleta = false" role="dialog" aria-modal="true" aria-labelledby="modal-venta-confirmada" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center" @click.stop>
    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-circle-check text-green-500 text-3xl"></i></div>
    <h3 id="modal-venta-confirmada" class="text-2xl font-display font-700 text-ink-900 mb-2">Venta Confirmada</h3>
    <p class="text-ink-500 text-sm mb-4">La venta se registro correctamente.</p>
    <div class="bg-ink-50 rounded-xl p-4 mb-4 text-left space-y-2">
      <div class="flex justify-between text-sm"><span class="text-ink-500">Venta</span><span class="font-mono font-semibold" x-text="boletaVenta?.boleta_code || '#V-' + (boletaVenta?.id || '')"></span></div>
      <div class="flex justify-between text-sm"><span class="text-ink-500">Cliente</span><span class="font-semibold text-ink-400">—</span></div>
      <div class="flex justify-between text-sm"><span class="text-ink-500">Metodo</span><span class="badge" :class="paymentBadgeClass(boletaVenta?.metodo, '')" x-text="paymentLabel(boletaVenta?.metodo, '') || 'Efectivo'"></span></div>
      <div class="flex justify-between text-sm border-t border-ink-200 pt-2"><span class="text-ink-900 font-semibold">Total</span><span class="font-display font-800 text-brand-600" x-text="'S/ ' + (boletaVenta?.total || 0).toFixed(2)"></span></div>
    </div>
    <div class="flex gap-3">
      <button @click="showModalBoleta = false" class="btn-ghost flex-1" aria-label="Cerrar modal"><i class="fa-solid fa-times mr-1"></i> Cerrar</button>
      <button @click="showModalBoleta = false; verBoleta(boletaVenta, true)" class="btn-primary flex-1"><i class="fa-solid fa-print mr-1"></i> Imprimir</button>
    </div>
  </div>
</div>

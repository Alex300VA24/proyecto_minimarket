<div x-show="showModalVerVenta" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalVerVenta = false" @keydown.escape.window="showModalVerVenta = false" role="dialog" aria-modal="true" aria-labelledby="modal-ver-venta-title" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" @click.stop>
    <div class="flex items-center justify-between p-5 border-b border-ink-100">
      <h3 id="modal-ver-venta-title" class="text-2xl font-display font-700 text-ink-900">Detalle de Venta</h3>
      <button @click="showModalVerVenta = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400" aria-label="Cerrar modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 space-y-4" x-show="ventaVer">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Codigo</p><p class="font-mono text-sm text-ink-800" x-text="ventaVer?.boleta_code || '#V-' + (ventaVer?.id || '')"></p></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Estado</p><span class="badge" :class="adminVentaBadgeClass(ventaVer?.estado)"><span class="cb-icon" style="display:none"><i :class="statusIcon(ventaVer?.estado)"></i> </span><span x-text="ventaVer?.estado"></span></span></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Cliente</p><p class="font-medium text-ink-800 text-sm" x-text="ventaVer?.cliente"></p></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Empleado</p><p class="text-ink-800 text-sm" x-text="ventaVer?.trabajador"></p></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Canal</p><span class="badge" :class="ventaVer?.canal === 'Online' ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'"><span class="cb-icon" style="display:none"><i :class="ventaVer?.canal === 'Online' ? 'fa-solid fa-globe' : 'fa-solid fa-store'"></i> </span><span x-text="ventaVer?.canal"></span></span></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Metodo</p><span class="badge" :class="paymentBadgeClass(ventaVer?.metodo_key || ventaVer?.metodo, ventaVer?.transfer_bank)"><span class="cb-icon" style="display:none"><i :class="(ventaVer?.metodo_key || ventaVer?.metodo) === 'yape' ? 'fa-solid fa-mobile-screen' : (ventaVer?.metodo_key || ventaVer?.metodo) === 'plin' ? 'fa-solid fa-mobile-screen-button' : (ventaVer?.metodo_key || ventaVer?.metodo) === 'cash' ? 'fa-solid fa-money-bill-wave' : 'fa-solid fa-building-columns'"></i> </span><span x-text="paymentLabel(ventaVer?.metodo_key || ventaVer?.metodo, ventaVer?.transfer_bank)"></span></span></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Items</p><p class="font-medium text-ink-800 text-sm" x-text="ventaVer?.items + ' productos'"></p></div>
        <div class="bg-ink-50 rounded-xl p-3"><p class="text-xs text-ink-400 mb-1">Fecha</p><p class="text-ink-800 text-sm" x-text="ventaVer?.fecha"></p></div>
      </div>
      <div class="bg-brand-50 rounded-xl p-4 border border-brand-200">
        <div class="flex justify-between text-sm mb-1"><span class="text-ink-500">Subtotal</span><span class="font-semibold" x-text="'S/ ' + ((ventaVer?.total || 0) / 1.18).toFixed(2)"></span></div>
        <div class="flex justify-between text-sm mb-1"><span class="text-ink-500">IGV (18%)</span><span class="font-semibold" x-text="'S/ ' + ((ventaVer?.total || 0) - (ventaVer?.total || 0) / 1.18).toFixed(2)"></span></div>
        <div class="flex justify-between text-sm border-t border-brand-200 pt-2 mt-2"><span class="text-ink-900 font-semibold">Total</span><span class="font-display font-800 text-brand-700" x-text="'S/ ' + (ventaVer?.total || 0).toFixed(2)"></span></div>
      </div>
    </div>
  </div>
</div>

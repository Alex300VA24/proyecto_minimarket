<div x-show="showModalCrearTrabajador" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalCrearTrabajador = false" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" @click.stop>
    <div class="flex items-center justify-between p-5 border-b border-ink-100">
      <h3 class="font-display font-700 text-ink-900">Crear Empleado</h3>
      <button @click="showModalCrearTrabajador = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Nombre</label><input x-model="formNuevoUsuario.nombre" type="text" class="inp" placeholder="Nombre completo"></div>
        <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Email</label><input x-model="formNuevoUsuario.email" type="email" class="inp" placeholder="correo@ejemplo.com"></div>
        <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Telefono</label><input x-model="formNuevoUsuario.telefono" type="tel" class="inp" placeholder="999 999 999"></div>
        <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Rol</label><select x-model="formNuevoUsuario.rol" class="inp"><option value="employee">Empleado</option><option value="admin">Admin</option></select></div>
      </div>
      <div class="bg-ink-50 rounded-xl p-3">
        <p class="text-xs text-ink-400"><i class="fa-solid fa-info-circle mr-1"></i> La contrasena inicial sera <strong>cambiar123</strong>. El usuario debera cambiarla en su primer ingreso.</p>
      </div>
      <div class="flex gap-3">
        <button @click="crearUsuario()" class="btn-primary flex-1 py-3 text-sm font-bold shadow-lg shadow-brand-200"><i class="fa-solid fa-check"></i> Registrar Empleado</button>
        <button @click="showModalCrearTrabajador = false" class="btn-ghost flex-1">Cerrar</button>
      </div>
    </div>
  </div>
</div>

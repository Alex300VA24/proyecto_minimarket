<div x-show="showModalAgregarGasto" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalAgregarGasto = false" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" @click.stop>
    <div class="flex items-center justify-between p-5 border-b border-ink-100">
      <h3 class="font-display font-700 text-ink-900" x-text="formGasto.id ? 'Editar Gasto' : 'Agregar Gasto'"></h3>
      <button @click="showModalAgregarGasto = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Concepto</label><input x-model="formGasto.concepto" type="text" class="inp" placeholder="Concepto del gasto"></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Tipo</label><select x-model="formGasto.tipo" class="inp"><option value="Fijo">Fijo</option><option value="Variable">Variable</option><option value="Operativo">Operativo</option><option value="Mantenimiento">Mantenimiento</option></select></div>
        <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Monto (S/)</label><input x-model.number="formGasto.monto" type="number" step="0.01" class="inp" placeholder="0.00"></div>
      </div>
      <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Fecha</label><input x-model="formGasto.fecha" type="date" class="inp"></div>
      <div><label class="block text-xs font-semibold text-ink-500 uppercase tracking-wide mb-1.5">Descripcion</label><textarea x-model="formGasto.descripcion" class="inp" rows="2" placeholder="Descripcion..."></textarea></div>
      <div x-show="formGasto.id">
        <button @click="showModalAgregarGasto = false; confirmarEliminarGasto(formGasto)" class="w-full text-sm text-red-500 hover:text-red-700 font-semibold py-2 border border-red-200 rounded-xl hover:bg-red-50 transition-colors"><i class="fa-solid fa-trash-can mr-1"></i> Eliminar este gasto</button>
      </div>
      <div class="flex gap-3">
        <button @click="guardarGasto()" class="btn-primary flex-1 py-3 text-sm font-bold shadow-lg shadow-brand-200"><i class="fa-solid fa-check"></i> Registrar Gasto</button>
        <button @click="showModalAgregarGasto = false" class="btn-ghost flex-1">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<div x-show="showModalCancelarVenta" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalCancelarVenta = false" @keydown.escape.window="showModalCancelarVenta = false" role="dialog" aria-modal="true" aria-labelledby="modal-cancelar-venta" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center" @click.stop>
    <div class="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i></div>
    <h3 id="modal-cancelar-venta" class="text-2xl font-display font-700 text-ink-900 mb-2">Cancelar Venta</h3>
    <p class="text-ink-500 text-sm mb-2">La venta <span class="font-semibold text-ink-700" x-text="'#V-' + (ventaCancelar?.id || '')"></span> de <span class="font-semibold text-ink-700" x-text="ventaCancelar?.cliente"></span> por <span class="font-semibold text-ink-700" x-text="'S/ ' + (ventaCancelar?.total || 0).toFixed(2)"></span> será cancelada.</p>
    <div class="mb-4">
      <textarea x-model="justificacionCancelarVenta" class="inp" rows="3" placeholder="Justificación (opcional)" maxlength="300"></textarea>
    </div>
    <div class="flex gap-3">
      <button @click="showModalCancelarVenta = false; justificacionCancelarVenta = ''" class="btn-ghost flex-1" aria-label="Cerrar modal"><i class="fa-solid fa-xmark mr-1"></i> Cerrar</button>
      <button @click="confirmarCancelarVenta()" class="btn-danger flex-1 py-3 text-sm font-bold shadow-lg shadow-red-200"><i class="fa-solid fa-xmark"></i> Sí, cancelar</button>
    </div>
  </div>
</div>

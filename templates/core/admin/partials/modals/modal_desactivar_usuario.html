<div x-show="showModalConfirmarDesactivar" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalConfirmarDesactivar = false" @keydown.escape.window="showModalConfirmarDesactivar = false" role="dialog" aria-modal="true" aria-labelledby="modal-desactivar-usuario" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center" @click.stop>
    <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4" :class="usuarioDesactivar?.activo ? 'bg-yellow-100' : 'bg-green-100'">
      <i :class="usuarioDesactivar?.activo ? 'fa-solid fa-user-slash text-yellow-500' : 'fa-solid fa-user-check text-green-500'" class="text-xl"></i>
    </div>
    <h3 id="modal-desactivar-usuario" class="text-2xl font-display font-700 text-ink-900 mb-2" x-text="usuarioDesactivar?.activo ? 'Desactivar Usuario' : 'Activar Usuario'"></h3>
    <p class="text-ink-500 text-sm mb-2">¿Estás seguro de <span x-text="usuarioDesactivar?.activo ? 'desactivar' : 'activar'"></span> a <span class="font-semibold text-ink-700" x-text="usuarioDesactivar?.nombre"></span>?</p>
    <div class="rounded-xl p-3 mb-6" :class="usuarioDesactivar?.activo ? 'bg-yellow-50 border border-yellow-200' : 'bg-green-50 border border-green-200'">
      <p class="text-xs" :class="usuarioDesactivar?.activo ? 'text-yellow-600' : 'text-green-600'">
        <i class="fa-solid fa-circle-info mr-1"></i>
        <span x-text="usuarioDesactivar?.activo ? 'El usuario no podrá acceder al sistema, pero mantendrá su historial.' : 'El usuario podrá volver a acceder al sistema.'"></span>
      </p>
    </div>
    <div class="flex gap-3">
      <button @click="showModalConfirmarDesactivar = false" class="btn-ghost flex-1" aria-label="Cerrar modal"><i class="fa-solid fa-xmark mr-1"></i> Cerrar</button>
      <button @click="toggleUsuarioEstado()" class="flex-1 py-3 px-4 rounded-lg font-bold text-white transition-all shadow-lg" :class="usuarioDesactivar?.activo ? 'bg-red-600 hover:bg-red-700 shadow-red-200' : 'bg-green-600 hover:bg-green-700 shadow-green-200'" x-text="usuarioDesactivar?.activo ? 'Desactivar' : 'Activar'"></button>
      
    </div>
  </div>
</div>

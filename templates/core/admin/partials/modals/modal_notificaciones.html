<!-- MODAL: Notificaciones -->
<div x-show="showModalNotificaciones" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalNotificaciones = false" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" @click.stop>
    <div class="flex items-center justify-between p-5 border-b border-ink-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center"><i class="fa-solid fa-bell text-amber-600"></i></div>
        <div>
          <h3 class="font-display font-700 text-ink-900">Notificaciones</h3>
          <p class="text-xs text-ink-400" x-text="pedidos.length + ' pedido(s) pendiente(s)'"></p>
        </div>
      </div>
      <button @click="showModalNotificaciones = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-5">
      <div x-show="pedidos.length === 0" class="text-center py-8">
        <i class="fa-regular fa-bell-slash text-ink-300 text-4xl mb-3 block"></i>
        <p class="font-display font-600 text-ink-500">Sin notificaciones</p>
        <p class="text-ink-400 text-sm mt-1">No hay pedidos online pendientes.</p>
      </div>
      <div class="space-y-3" x-show="pedidos.length > 0">
        <template x-for="pedido in pedidos" :key="pedido.id">
          <div class="bg-ink-50 rounded-xl p-4">
            <div class="flex items-center justify-between mb-2">
              <span class="font-mono text-xs text-ink-500" x-text="'#PED-' + pedido.id"></span>
              <span class="badge" :class="adminOrderBadgeClass(pedido.estado)" x-text="pedido.estado"></span>
            </div>
            <p class="font-medium text-ink-800 text-sm" x-text="pedido.cliente"></p>
            <p class="text-xs text-ink-400 mt-1" x-text="pedido.items + ' producto(s)'"></p>
            <div class="flex items-center justify-between mt-2">
              <span class="font-display font-700 text-ink-900" x-text="'S/ ' + pedido.total.toFixed(2)"></span>
              <span class="text-xs text-ink-400" x-text="pedido.fecha"></span>
            </div>
            <div class="flex gap-2 mt-3">
              <button @click="showModalNotificaciones = false; adminSection = 'pedidos-online'" class="btn-primary text-xs py-1.5 flex-1"><i class="fa-solid fa-eye mr-1"></i> Ver</button>
              <button x-show="pedido.estado_key === 'pending'" @click="cambiarEstadoPedido(pedido, 'Listo para entrega')" class="btn-accent text-xs py-1.5 flex-1">Listo</button>
              <button x-show="pedido.estado_key === 'ready'" @click="cambiarEstadoPedido(pedido, 'Completado')" class="bg-green-600 hover:bg-green-700 text-white text-xs py-1.5 px-3 rounded-lg flex-1">Completar</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

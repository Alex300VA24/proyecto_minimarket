      <!-- USUARIOS -->
      <div x-show="adminSection === 'usuarios' && isAdmin" class="space-y-6">
        <div class="flex items-center justify-between">
          <button x-show="isAdmin" @click="showModalCrearTrabajador = true" class="btn-primary text-sm py-2.5"><i class="fa-solid fa-user-plus"></i> Registrar Usuario</button>
        </div>
        <div class="bg-white rounded-2xl border border-ink-100 shadow-sm overflow-hidden hover-glow fade-up" style="border-top: 3px solid #60a5fa;" x-data="{ get usuariosPg() { return paginatedItems(filteredUsuarios, usuariosPage) } }">
          <div class="flex border-b border-ink-100 px-4">
            <button @click="usuarioTab = 'todos'" :class="usuarioTab === 'todos' ? 'tab-item tab-active' : 'tab-item'">Todos</button>
            <button @click="usuarioTab = 'trabajadores'" :class="usuarioTab === 'trabajadores' ? 'tab-item tab-active' : 'tab-item'">Empleados</button>
            <button @click="usuarioTab = 'clientes'" :class="usuarioTab === 'clientes' ? 'tab-item tab-active' : 'tab-item'">Clientes</button>
          </div>
          <div class="p-4 border-b border-ink-100 flex items-center gap-3">
            <div class="relative flex-1 max-w-sm">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-sm"></i>
              <input x-model="busquedaUsuario" type="text" class="inp pl-9" placeholder="Buscar usuario...">
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead><tr class="tbl-head bg-ink-50"><th class="text-left">Usuario</th><th class="text-left">Email</th><th class="text-left">Rol</th><th class="text-left">Estado</th><th class="text-left">Acciones</th></tr></thead>
              <tbody>
                <template x-for="usuario in usuariosPg.items" :key="usuario.id">
                  <tr class="tbl-row">
                    <td>
                      <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-ink-200 flex items-center justify-center text-ink-600 text-xs font-bold" x-text="usuario.nombre.charAt(0)"></div>
                        <span class="font-medium text-ink-800 text-sm" x-text="usuario.nombre"></span>
                      </div>
                    </td>
                    <td class="text-ink-500 text-sm" x-text="usuario.email"></td>
                    <td>
                      <span class="badge"
                            :class="{
                              'role-admin': usuario.rol === 'admin',
                              'role-employee': usuario.rol === 'employee',
                              'role-client': usuario.rol === 'client'
                            }"
                            x-text="usuario.rol === 'admin' 
                                      ? 'Administrador' 
                                      : usuario.rol === 'employee' 
                                        ? 'Empleado' 
                                        : 'Cliente'">
                      </span>
                    </td>

                    <td><span class="badge" :class="usuario.activo ? 'bg-green-100 text-green-700' : 'bg-ink-100 text-ink-500'" x-text="usuario.activo ? 'Activo' : 'Inactivo'"></span></td>
                    <td>
                      <div class="flex gap-1.5">
                        <button @click="verUsuario(usuario)" class="btn-action-view"><i class="fa-regular fa-eye text-xs"></i></button>
                        <button @click="editarUsuario(usuario)" class="btn-action-edit"><i class="fa-regular fa-pen-to-square text-xs"></i></button>
                        <button @click="desactivarUsuario(usuario)" class="btn-action-toggle" :title="usuario.activo ? 'Desactivar' : 'Activar'"><i class="fa-solid fa-power-off text-xs"></i></button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="pagination" x-show="usuariosPg.total > 0">
            <p class="pagination-info">Mostrando <span x-text="((usuariosPg.currentPage - 1) * PER_PAGE) + 1"></span>-<span x-text="Math.min(usuariosPg.currentPage * PER_PAGE, usuariosPg.total)"></span> de <span x-text="usuariosPg.total"></span></p>
            <div class="pagination-btns">
              <button @click="usuariosPage = 1" :disabled="usuariosPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-angles-left text-xs"></i></button>
              <button @click="usuariosPage = Math.max(1, usuariosPage - 1)" :disabled="usuariosPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-chevron-left text-xs"></i></button>
              <template x-for="p in getPageRange(usuariosPg.currentPage, usuariosPg.totalPages)" :key="'users-'+p">
                <button x-show="p !== '...'" @click="usuariosPage = p" :class="p === usuariosPg.currentPage ? 'page-active' : ''" class="page-btn" x-text="p"></button>
                <span x-show="p === '...'" class="page-ellipsis">...</span>
              </template>
              <button @click="usuariosPage = Math.min(usuariosPg.totalPages, usuariosPage + 1)" :disabled="usuariosPg.currentPage === usuariosPg.totalPages" class="page-btn"><i class="fa-solid fa-chevron-right text-xs"></i></button>
              <button @click="usuariosPage = usuariosPg.totalPages" :disabled="usuariosPg.currentPage === usuariosPg.totalPages" class="page-btn"><i class="fa-solid fa-angles-right text-xs"></i></button>
            </div>
          </div>
          <div x-show="usuariosPg.total === 0" class="px-6 py-12 text-center text-ink-400">
            <i class="fa-solid fa-users text-4xl mb-3 block"></i>
            <p class="font-display font-600">No se encontraron usuarios</p>
          </div>
        </div>
      </div>

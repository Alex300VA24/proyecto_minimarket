      <!-- GASTOS -->
      <div x-show="adminSection === 'gastos' && isAdmin" class="space-y-4">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
          <template x-for="(tipo, idx) in ['Fijo', 'Variable', 'Operativo', 'Mantenimiento']" :key="tipo">
            <div class="bg-white rounded-2xl p-5 relative overflow-hidden shadow-sm stat-card"
                 :style="'border-top: 4px solid ' + (tipo === 'Fijo' ? '#3b82f6' : tipo === 'Variable' ? '#0ea5e9' : tipo === 'Operativo' ? '#9333ea' : '#64748b')"
                 :class="tipo === 'Fijo' ? 'fade-up' : tipo === 'Variable' ? 'fade-up-d1' : tipo === 'Operativo' ? 'fade-up-d2' : 'fade-up-d3'">
              <div class="absolute top-3 right-3 text-4xl stat-icon">
                <i class="fa-solid icon-float"
                   :class="tipo === 'Fijo' ? 'fa-lock' : tipo === 'Variable' ? 'fa-arrows-rotate' : tipo === 'Operativo' ? 'fa-gears' : 'fa-wrench'"
                   :style="'color: ' + (tipo === 'Fijo' ? '#3b82f6' : tipo === 'Variable' ? '#0ea5e9' : tipo === 'Operativo' ? '#9333ea' : '#64748b')"></i>
              </div>
              <p class="text-ink-400 text-xs uppercase tracking-widest font-semibold mb-1" x-text="tipo"></p>
              <div class="flex items-end gap-2">
                <p class="text-2xl font-display font-800 text-ink-900" x-text="'S/ ' + gastos.filter(g => g.tipo === tipo).reduce((s, g) => s + g.monto, 0).toFixed(2)"></p>
              </div>
              <p class="text-ink-400 text-xs mt-1" x-text="gastos.filter(g => g.tipo === tipo).length + ' registros'"></p>
            </div>
          </template>
        </div>
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-3">
            <div class="rounded-xl px-4 py-2 flex items-center gap-3 bg-blue-600 text-white shadow-sm hover:shadow-md hover:scale-[1.02] active:scale-95 transition-all cursor-pointer" @click="resetFormGasto(); showModalAgregarGasto = true">
              <i class="fa-solid fa-plus-circle text-white text-2xl"></i>
              <span class="text-sm font-semibold text-white">Registrar Gasto</span>
            </div>
            <div class="rounded-xl px-4 py-2 flex items-center gap-3 bg-emerald-600 shadow-sm hover:shadow-md hover:scale-[1.02] active:scale-95 transition-all cursor-pointer" @click="generarReporteGastos()">
              <i class="fa-solid fa-file-pdf text-white text-2xl"></i>
              <span class="text-sm font-semibold text-white">Reporte de Gastos</span>
            </div>
          </div>
        </div>
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-3 w-full">
            <div class="relative flex-1 min-w-64">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-xs"></i>
              <input x-model="busquedaGasto" type="text" placeholder="Buscar por ID o concepto..." class="inp pl-9">
            </div>
            <input x-model="filtroFechaGasto" type="date" class="inp w-auto">
            <select x-model="filtroTipoGasto" class="inp w-auto">
              <option value="">Todos los tipos</option>
              <option value="Fijo">Fijo</option>
              <option value="Variable">Variable</option>
              <option value="Operativo">Operativo</option>
              <option value="Mantenimiento">Mantenimiento</option>
            </select>
          </div>
        </div>
        <div class="bg-white rounded-2xl border border-ink-100 shadow-sm overflow-hidden hover-glow fade-up-d4" style="border-top: 3px solid #60a5fa;" x-data="{ get gastosPg() { return paginatedItems(getGastosFiltradas(), gastosPage) } }">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead><tr class="tbl-head bg-ink-50"><th class="text-left">ID</th><th class="text-left">Concepto</th><th class="text-left">Tipo</th><th class="text-left">Monto</th><th class="text-left">Fecha</th><th class="text-left">Acciones</th></tr></thead>
              <tbody>
                <template x-for="gasto in gastosPg.items" :key="gasto.id">
                  <tr class="tbl-row">
                    <td class="font-mono text-xs text-ink-500 font-semibold" x-text="'GAS-' + String(gasto.id).padStart(4, '0')"></td>
                    <td class="font-medium text-ink-800" x-text="gasto.concepto"></td>
                    <td><span class="badge" :class="gasto.tipo === 'Fijo' ? 'bg-blue-100 text-blue-700' : gasto.tipo === 'Variable' ? 'bg-sky-100 text-sky-700' : gasto.tipo === 'Operativo' ? 'bg-special-100 text-special-700' : 'bg-ink-100 text-ink-600'"><span class="cb-icon" style="display:none"><i :class="gasto.tipo === 'Fijo' ? 'fa-solid fa-lock' : gasto.tipo === 'Variable' ? 'fa-solid fa-arrows-rotate' : gasto.tipo === 'Operativo' ? 'fa-solid fa-gears' : 'fa-solid fa-wrench'" class="mr-1"></i> </span><span x-text="gasto.tipo"></span></span></td>
                    <td class="font-display font-700 text-ink-900" x-text="'S/ ' + gasto.monto.toFixed(2)"></td>
                    <td class="text-ink-400 text-xs" x-text="gasto.fecha"></td>
                    <td>
                      <div class="flex gap-1.5">
                        <button @click="verGasto(gasto)" class="btn-action-view" title="Ver detalle"><i class="fa-regular fa-eye text-xs"></i></button>
                        <button @click="editarGasto(gasto)" class="btn-action-edit" title="Editar"><i class="fa-regular fa-pen-to-square text-xs"></i></button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="pagination" x-show="gastosPg.total > 0">
            <p class="pagination-info">Mostrando <span x-text="((gastosPg.currentPage - 1) * PER_PAGE) + 1"></span>-<span x-text="Math.min(gastosPg.currentPage * PER_PAGE, gastosPg.total)"></span> de <span x-text="gastosPg.total"></span></p>
            <div class="pagination-btns">
              <button @click="gastosPage = 1" :disabled="gastosPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-angles-left text-xs"></i></button>
              <button @click="gastosPage = Math.max(1, gastosPage - 1)" :disabled="gastosPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-chevron-left text-xs"></i></button>
              <template x-for="p in getPageRange(gastosPg.currentPage, gastosPg.totalPages)" :key="'gastos-'+p">
                <button x-show="p !== '...'" @click="gastosPage = p" :class="p === gastosPg.currentPage ? 'page-active' : ''" class="page-btn" x-text="p"></button>
                <span x-show="p === '...'" class="page-ellipsis">...</span>
              </template>
              <button @click="gastosPage = Math.min(gastosPg.totalPages, gastosPage + 1)" :disabled="gastosPg.currentPage === gastosPg.totalPages" class="page-btn"><i class="fa-solid fa-chevron-right text-xs"></i></button>
              <button @click="gastosPage = gastosPg.totalPages" :disabled="gastosPg.currentPage === gastosPg.totalPages" class="page-btn"><i class="fa-solid fa-angles-right text-xs"></i></button>
            </div>
          </div>
          <div x-show="gastosPg.total === 0" class="px-6 py-12 text-center text-ink-400">
            <i class="fa-solid fa-receipt text-4xl mb-3 inline-block"></i>
            <p class="font-display font-600">No se encontraron gastos</p>
          </div>
        </div>
      </div>

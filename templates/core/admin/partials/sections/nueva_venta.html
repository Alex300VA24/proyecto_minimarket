<!-- VENTAS - PEDIDOS ONLINE / VENTA MANUAL -->
<div x-show="adminSection === 'nueva-venta'" class="dashboard-surface space-y-6">
  <div class="flex flex-wrap gap-2 mb-2 fade-up">
    <button @click="ventaTab = 'manual'" :class="ventaTab === 'manual' ? 'btn-primary shadow-lg shadow-brand-200 scale-105' : 'btn-secondary'" class="gap-2 px-5 py-2.5 sm:px-6 sm:py-3 rounded-xl font-display font-700 text-xs sm:text-sm transition-all hover:scale-[1.02] active:scale-95">
      <i class="fa-solid fa-store"></i> Venta Manual
      <span x-show="ventaTab === 'manual'" class="bg-white/20 px-2 py-0.5 rounded-full text-xs">Presencial</span>
    </button>
    <button @click="ventaTab = 'online'" :class="ventaTab === 'online' ? 'btn-accent shadow-lg shadow-accent-200 scale-105' : 'btn-secondary'" class="gap-2 px-4 py-2.5 sm:px-6 sm:py-3 rounded-xl font-display font-700 text-xs sm:text-sm transition-all hover:scale-[1.02] active:scale-95">
      <i class="fa-solid fa-truck-fast"></i> Pedidos Online
      <span x-show="ventaTab === 'online'" class="bg-white/20 px-2 py-0.5 rounded-full text-xs">Delivery</span>
    </button>

  </div>

  <!-- PEDIDOS ONLINE -->
  <div x-show="ventaTab === 'online'" class="space-y-4 fade-up-d1">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div class="relative flex flex-wrap items-center gap-3 w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-sm"></i>
          <input
              x-model="busquedaPedido"
              type="text"
              class="inp pl-9"
              placeholder="Buscar pedido...">
      </div>
      <select x-model="filtroEstadoPedido" class="inp w-auto">
        <option value="">Todos los estados</option>
        <option value="pending">Pendiente</option>
        <option value="ready">Listo para entrega</option>
        <option value="completed">Completado</option>
      </select>
    </div>
    <div class="dashboard-panel p-5 overflow-hidden">
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-for="(pedido, idx) in filteredPedidosOnline" :key="pedido.id">
        <div class="dashboard-metric-card fade-up" :style="'animation-delay:' + (idx * 0.06) + 's'">
          <div class="flex items-center justify-between mb-3">
            <span class="font-mono text-xs text-ink-500" x-text="'#PED-' + pedido.id"></span>
            <span class="badge" :class="adminOrderBadgeClass(pedido.estado)"><span class="cb-icon" style="display:none"><i :class="statusIcon(pedido.estado)"></i> </span><span x-text="pedido.estado"></span></span>
          </div>
          <p class="font-medium text-ink-800 text-sm mb-1" x-text="pedido.cliente"></p>
          <p class="text-xs text-ink-400 mb-3" x-text="pedido.items + ' productos'"></p>
          <div class="flex items-center justify-between mb-3">
            <span class="font-display font-700 text-ink-900" x-text="'S/ ' + pedido.total.toFixed(2)"></span>
            <span class="text-xs text-ink-400" x-text="pedido.fecha"></span>
          </div>
          <div class="flex gap-2">
            <button @click="verPedidoOnline(pedido)" class="btn-ghost text-xs py-1.5 flex-1"><i class="fa-regular fa-eye mr-1"></i> Ver Pedido</button>
            <button x-show="pedido.estado_key === 'pending'" @click="marcarListoDirecto(pedido)" class="btn-primary text-xs py-1.5 flex-1" :disabled="showLoadingOverlay">
              <span x-text="showLoadingOverlay ? '...' : 'Listo'"></span>
            </button>
            <button x-show="pedido.estado_key === 'ready'" @click="abrirQRScanner(pedido)" class="btn-accent text-xs py-1.5 px-3" title="QR"><i class="fa-solid fa-qrcode"></i></button>
          </div>
        </div>
      </template>
      <div x-show="filteredPedidosOnline.length === 0" class="col-span-full text-center py-12 text-ink-400">
        <i class="fa-solid fa-box-open text-4xl mb-3 inline-block"></i>
        <p class="font-display font-600">No se encontraron pedidos</p>
      </div>
    </div>
    </div>
  </div>

  <!-- VENTA MANUAL -->
  <div x-show="ventaTab === 'manual'" class="grid lg:grid-cols-3 gap-6 dashboard-panel p-5 fade-up-d2">
    <div class="lg:col-span-2 flex flex-col">
      <div class="dashboard-panel p-5 flex-1 flex flex-col">
        <h3 class="font-display font-700 text-ink-900 mb-3">Buscar productos</h3>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-sm"></i>
          <input x-model="busquedaVentaProducto" type="text" class="inp pl-9" placeholder="Escribe el nombre o codigo...">
        </div>
        <div class="mt-3 flex-1 overflow-y-auto space-y-1 max-h-[480px]">
          <template x-for="prod in filteredVentaProductos" :key="prod.id">
            <button @click="agregarAlCarrito(prod)" class="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-ink-50 transition-colors text-left">
              <template x-if="prod.imagen">
                <img :src="prod.imagen" class="w-10 h-10 rounded-lg object-contain bg-ink-50" alt="imagen">
              </template>
              <template x-if="!prod.imagen">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center" :style="'background:' + prod.color"><i :class="prod.icono + ' text-white text-sm'"></i></div>
              </template>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-ink-800 truncate" x-text="prod.nombre"></p>
                <p class="text-xs text-ink-400" x-text="'Stock: ' + productoStock(prod)"></p>
              </div>
              <span class="text-sm font-display font-700 text-ink-900" x-text="'S/ ' + productoPrecio(prod).toFixed(2)"></span>
              <i class="fa-solid fa-cart-plus text-xl text-brand-600"></i>
            </button>
          </template>
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-4">
      <div class="dashboard-panel p-5 flex-shrink-0">
        <!-- Título con contador de ítems diferentes -->
        <div class="flex items-center gap-2 mb-3">
          <h3 class="font-display font-700 text-ink-900">Carrito</h3>
          <span x-show="carrito.length > 0" 
                x-text="carrito.length" 
                class="bg-ink-100 text-ink-700 text-xs font-bold px-2 py-0.5 rounded-full">
          </span>
        </div>
        
        <div x-show="carrito.length === 0" class="text-center py-8 text-ink-400 text-sm">
          <i class="fa-solid fa-cart-shopping text-3xl mb-2 opacity-30"></i>
          <p>Vacio</p>
        </div>
        <div class="space-y-2 max-h-64 overflow-y-auto" :class="carrito.length > 2 ? 'pr-1' : ''"
             style="scrollbar-width: thin; scrollbar-color: #d1d5db transparent;"
             @scroll="$el.style.scrollbarColor = '#9ca3af transparent'">
          <template x-for="(item, idx) in carrito" :key="idx">
            <div class="flex items-center gap-2 p-2 bg-ink-50 rounded-xl">
              <template x-if="item.imagen">
                <img :src="item.imagen" class="w-7 h-7 rounded-lg object-contain bg-ink-50" alt="imagen">
              </template>
              <template x-if="!item.imagen">
                <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" :style="'background:' + (item.color || '#2563eb')"><i :class="(item.icono || 'fa-solid fa-box') + ' text-white text-xs'"></i></div>
              </template>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-ink-800 truncate" x-text="item.nombre"></p>
                <p class="text-xs text-ink-400" x-text="'S/ ' + item.precio.toFixed(2)"></p>
              </div>
              <div class="flex items-center gap-1">
                <button @click="item.cantidad > 1 ? item.cantidad-- : carrito.splice(idx, 1)" class="qty-btn text-xs"><i class="fa-solid fa-minus text-xs"></i></button>
                <span class="w-6 text-center text-sm font-semibold" x-text="item.cantidad"></span>
                <button @click="item.cantidad++" class="qty-btn text-xs"><i class="fa-solid fa-plus text-xs"></i></button>
              </div>
              <span class="text-sm font-display font-700 text-ink-900 w-16 text-right" x-text="'S/ ' + (item.precio * item.cantidad).toFixed(2)"></span>
            </div>
          </template>
        </div>
      </div>
      <div class="dashboard-panel p-5" x-show="carrito.length > 0">
        <h3 class="font-display font-700 text-ink-900 mb-3">Resumen</h3>
        <div class="space-y-2 mb-3">
          <div class="flex justify-between text-sm"><span class="text-ink-500">Subtotal</span><span class="font-semibold" x-text="'S/ ' + ventaSubtotal.toFixed(2)"></span></div>
          <div class="flex justify-between text-sm"><span class="text-ink-500">IGV (18%)</span><span class="font-semibold" x-text="'S/ ' + ventaIGV.toFixed(2)"></span></div>
          <div class="flex justify-between text-sm border-t border-ink-100 pt-2"><span class="text-ink-900 font-semibold">Total</span><span class="font-display font-800 text-ink-900" x-text="'S/ ' + ventaTotal.toFixed(2)"></span></div>
        </div>
        <button @click="abrirModalPago()" class="btn-primary w-full py-3 text-sm font-bold shadow-lg shadow-brand-200"><i class="fa-solid fa-credit-card"></i> Registrar Venta</button>
      </div>
    </div>
  </div>
</div>

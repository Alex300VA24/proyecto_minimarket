      <!-- INVENTARIO -->
      <div x-show="adminSection === 'inventario'" class="space-y-6">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="bg-white rounded-2xl p-5 relative overflow-hidden shadow-sm stat-card fade-up" style="border-top: 4px solid #3b82f6;">
            <div class="absolute top-3 right-3 text-4xl stat-icon"><i class="fa-solid fa-boxes-stacked icon-float" style="color: #3b82f6"></i></div>
            <p class="text-ink-400 text-xs uppercase tracking-widest font-semibold mb-1">Total productos</p>
            <p class="text-2xl font-display font-800 text-ink-900" x-text="productos.length"></p>
          </div>
          <div class="bg-white rounded-2xl p-5 relative overflow-hidden shadow-sm stat-card fade-up-d1" style="border-top: 4px solid #22c55e;">
            <div class="absolute top-3 right-3 text-4xl stat-icon"><i class="fa-solid fa-check-circle icon-float-slow" style="color: #22c55e"></i></div>
            <p class="text-ink-400 text-xs uppercase tracking-widest font-semibold mb-1">Stock normal</p>
            <p class="text-2xl font-display font-800 text-ink-900" x-text="productos.filter(p => productoStock(p) >= p.umbral).length"></p>
          </div>
          <div class="bg-white rounded-2xl p-5 relative overflow-hidden shadow-sm stat-card fade-up-d2" style="border-top: 4px solid #ef4444;">
            <div class="absolute top-3 right-3 text-4xl stat-icon"><i class="fa-solid fa-triangle-exclamation icon-float-fast" style="color: #ef4444"></i></div>
            <p class="text-ink-400 text-xs uppercase tracking-widest font-semibold mb-1">Stock bajo</p>
            <p class="text-2xl font-display font-800 text-red-500" x-text="productos.filter(p => productoStock(p) < p.umbral).length"></p>
          </div>
          <div class="bg-white rounded-2xl p-5 relative overflow-hidden shadow-sm stat-card fade-up-d3" style="border-top: 4px solid #f59e0b;">
            <div class="absolute top-3 right-3 text-4xl stat-icon"><i class="fa-solid fa-coins icon-float-reverse" style="color: #f59e0b"></i></div>
            <p class="text-ink-400 text-xs uppercase tracking-widest font-semibold mb-1">Valor total</p>
            <p class="text-2xl font-display font-800 text-ink-900" x-text="'S/ ' + productos.reduce((s, p) => s + (productoPrecio(p) * productoStock(p)), 0).toFixed(2)"></p>
          </div>
        </div>

        {# Boton de registrar #}
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-99">
          <!-- Botón a la izquierda -->
          <div class="rounded-xl px-4 py-2 flex items-center gap-3 bg-blue-600 shadow-sm hover:shadow-md transition-shadow cursor-pointer" @click="resetFormProducto(); showModalAgregarProducto = true">
            <img src="/static/src/images/registrar_producto.png" alt="Registrar Producto" class="h-12">
            <span class="text-sm font-semibold text-white">Registrar Producto</span>
          </div>
        </div>

        {# Buscar y Filtrar #}
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-99">
          <!-- Bloque de búsqueda y select a la derecha -->
          <div class="flex items-center gap-3 flex-1">
            <div class="relative flex-1 max-96">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-sm"></i>
              <input x-model="busquedaInventario" type="text" class="inp pl-9" placeholder="Buscar producto...">
            </div>
            <select x-model="filtroCategoria" class="inp w-auto">
              <option value="">Todas las categorias</option>
              <template x-for="cat in categorias" :key="cat.id">
                <option :value="cat.name" x-text="cat.name"></option>
              </template>
            </select>
          </div>
        </div>


        <div class="bg-white rounded-2xl border border-ink-100 shadow-sm overflow-hidden hover-glow fade-up-d4" style="border-top: 3px solid #60a5fa;">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead><tr class="tbl-head bg-ink-50"><th class="text-left">Producto</th><th class="text-left">Codigo</th><th class="text-left">Categoria</th><th class="text-left">P. Venta</th><th class="text-left">Stock</th><th class="text-left">Estado</th><th class="text-left">Acciones</th></tr></thead>
              <tbody>
                <template x-for="prod in invPg.items" :key="prod.id">
                  <tr class="tbl-row" :class="productoStock(prod) < prod.umbral ? 'bg-red-50' : ''">
                    <td>
                      <div class="flex items-center gap-3">
                        <template x-if="prod.imagen">
                          <img :src="prod.imagen" class="w-10 h-10 rounded-lg object-contain bg-ink-50" alt="imagen">
                        </template>
                        <template x-if="!prod.imagen">
                          <div class="w-8 h-8 rounded-lg flex items-center justify-center" :style="'background:' + prod.color"><i :class="prod.icono + ' text-white text-sm'"></i></div>
                        </template>
                        <span class="font-medium text-ink-800 text-sm" x-text="prod.nombre"></span>
                      </div>
                    </td>
                    <td class="font-mono text-xs text-ink-500" x-text="prod.codigo"></td>
                    <td><span class="badge bg-ink-100 text-ink-600"><span class="cb-icon" style="display:none"><i class="fa-solid fa-tag mr-1"></i> </span><span x-text="prod.categoria"></span></span></td>
                    <td class="font-display font-700 text-ink-900 text-sm" x-text="'S/ ' + productoPrecio(prod).toFixed(2)"></td>
                    
                    <td>
                      <div class="flex items-center gap-2">
                        <div class="w-16 h-2 rounded-full bg-ink-100 overflow-hidden">
                          <div class="h-full rounded-full" :class="productoStock(prod) < prod.umbral ? 'bg-red-500' : 'bg-green-500'" :style="'width:' + Math.min(100, (productoStock(prod) / 50) * 100) + '%'"></div>
                        </div>
                        <span class="text-sm" :class="productoStock(prod) < prod.umbral ? 'text-red-500 font-semibold' : 'text-ink-600'" x-text="productoStock(prod)"></span>
                      </div>
                    </td>
                    <td>
                      <span x-show="productoStock(prod) < prod.umbral" class="badge bg-red-100 text-red-700"><i class="fa-solid fa-triangle-exclamation text-xs"></i> Stock bajo</span>
                      <span x-show="productoStock(prod) >= prod.umbral" class="badge bg-green-100 text-green-700"><span class="cb-icon" style="display:none"><i class="fa-solid fa-check-circle mr-1"></i> </span>Disponible</span>
                    </td>
                    <td>
                      <div class="flex gap-1.5">
                        <button @click="verProducto(prod)" class="btn-action-view" title="Ver"><i class="fa-regular fa-eye text-xs"></i></button>
                        <button @click="editarProducto(prod)" class="btn-action-edit" title="Editar"><i class="fa-regular fa-pen-to-square text-xs"></i></button>
                        <button @click="abrirRegistrarLote(prod)" class="btn-action-add" title="Registrar Lote"><i class="fa-solid fa-box-open text-xs"></i></button>
                        <button @click="abrirEditarLote(prod)" class="btn-action-edit" title="Editar Lote" x-show="prod.lotes && prod.lotes.length > 0">
                          <img src="/static/src/images/editar_lote.png" alt="Editar lote" class="w-6 h-6" />
                        </button>
                        <button @click="confirmarEliminarProducto(prod)" class="btn-action-delete" title="Eliminar"><i class="fa-regular fa-trash-can text-xs"></i></button>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="pagination" x-show="invPg.total > 0">
            <p class="pagination-info">Mostrando <span x-text="((invPg.currentPage - 1) * PER_PAGE) + 1"></span>-<span x-text="Math.min(invPg.currentPage * PER_PAGE, invPg.total)"></span> de <span x-text="invPg.total"></span></p>
            <div class="pagination-btns">
              <button @click="invPage = 1" :disabled="invPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-angles-left text-xs"></i></button>
              <button @click="invPage = Math.max(1, invPage - 1)" :disabled="invPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-chevron-left text-xs"></i></button>
              <template x-for="p in getPageRange(invPg.currentPage, invPg.totalPages)" :key="'inv-'+p">
                <button x-show="p !== '...'" @click="invPage = p" :class="p === invPg.currentPage ? 'page-active' : ''" class="page-btn" x-text="p"></button>
                <span x-show="p === '...'" class="page-ellipsis">...</span>
              </template>
              <button @click="invPage = Math.min(invPg.totalPages, invPage + 1)" :disabled="invPg.currentPage === invPg.totalPages" class="page-btn"><i class="fa-solid fa-chevron-right text-xs"></i></button>
              <button @click="invPage = invPg.totalPages" :disabled="invPg.currentPage === invPg.totalPages" class="page-btn"><i class="fa-solid fa-angles-right text-xs"></i></button>
            </div>
          </div>
          <div x-show="invPg.total === 0" class="px-6 py-12 text-center text-ink-400">
            <i class="fa-solid fa-box-open text-4xl mb-3 inline-block"></i>
            <p class="font-display font-600">No se encontraron productos</p>
          </div>
        </div>
      </div>

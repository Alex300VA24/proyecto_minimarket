      <!-- DASHBOARD -->
      <div x-show="adminSection === 'dashboard' && isAdmin" class="space-y-6">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
          <div class="stat-blue rounded-2xl p-5 text-white relative overflow-hidden noise stat-card gradient-shift">
            <div class="absolute top-4 right-4 opacity-20 text-5xl stat-icon flex items-center justify-center"><i class="fa-solid fa-bag-shopping icon-float"></i></div>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mb-1">Productos mas vendidos</p>
            <div class="text-3xl font-display font-800" x-text="dashboardData.ventasSemana"></div>
            <p class="text-white/60 text-xs mt-1">Promedio <span x-text="dashboardData.promedioDiario"></span>/dia</p>
          </div>
          <div class="stat-dark rounded-2xl p-5 text-white relative overflow-hidden noise stat-card gradient-shift">
            <div class="absolute top-4 right-4 opacity-20 text-5xl stat-icon flex items-center justify-center"><i class="fa-solid fa-receipt icon-float-slow"></i></div>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mb-1">Lo que se gasto este mes</p>
            <div class="text-3xl font-display font-800" x-text="dashboardData.gastosMes"></div>
            <p class="text-white/60 text-xs mt-1">Queda <span x-text="dashboardData.presupuestoRestante"></span> de presupuesto</p>
          </div>

          <div class="stat-stone rounded-2xl p-5 text-white relative overflow-hidden noise stat-card gradient-shift">
            <div class="absolute top-4 right-4 opacity-20 text-5xl stat-icon flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation icon-float-reverse"></i></div>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mb-1">Hay que reponer ya</p>
            <div class="text-3xl font-display font-800 text-red-300" x-text="dashboardData.stockBajo"></div>
            <p class="text-white/60 text-xs mt-1">con menos de 10 unidades</p>
          </div>
          <div class="bg-gradient-to-br from-purple-600 to-purple-400 rounded-2xl p-5 text-white relative overflow-hidden noise stat-card gradient-shift">
            <div class="absolute top-4 right-4 opacity-20 text-5xl stat-icon flex items-center justify-center"><i class="fa-solid fa-clock icon-float-slow"></i></div>
            <p class="text-white/70 text-xs font-semibold uppercase tracking-widest mb-1">Pedidos por entregar</p>
            <div class="text-3xl font-display font-800" x-text="dashboardData.pedidosPendientes"></div>
            <p class="text-white/60 text-xs mt-1">La gente esta esperando</p>
          </div>
        </div>
        <div class="grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 bg-white rounded-2xl border border-ink-100 shadow-sm overflow-hidden hover-glow fade-up">
            <div class="px-6 py-4 border-b border-ink-100 flex items-center justify-between">
              <h3 class="font-display font-700 text-ink-900">Ventas de la semana</h3>
              <span class="badge bg-ink-100 text-ink-500">7 dias</span>
            </div>
            <div class="p-6">
              <div class="flex items-end gap-2 h-48">
                <template x-for="(day, idx) in chartData" :key="idx">
                  <div class="flex-1 flex flex-col items-center gap-1">
                    <span class="text-xs text-ink-500 font-semibold" x-text="'S/' + (day.ventas/1000).toFixed(1) + 'k'"></span>
                    <div class="w-full rounded-t-lg transition-all duration-500 hover:opacity-80" :style="'height:' + (day.ventas / maxChartVenta * 100) + '%'" :class="idx === chartData.length - 1 ? 'bg-brand-500' : 'bg-brand-200'"></div>
                    <span class="text-xs text-ink-400" x-text="day.label"></span>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-ink-100 shadow-sm overflow-hidden hover-glow fade-up-d1">
            <div class="px-6 py-4 border-b border-ink-100">
              <h3 class="font-display font-700 text-ink-900">Los productos mas vendidos</h3>
            </div>
            <div class="divide-y divide-ink-50">
              <template x-for="(prod, idx) in topProductos" :key="idx">
                <div class="flex items-center gap-3 px-5 py-3 transition-colors hover:bg-ink-50/50">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-transform hover:scale-110" :class="idx === 0 ? 'bg-accent-100 text-accent-700' : idx === 1 ? 'bg-ink-200 text-ink-600' : 'bg-ink-100 text-ink-500'" x-text="idx + 1"></div>
                  <div class="w-9 h-9 rounded-lg overflow-hidden bg-ink-100 flex-shrink-0 flex items-center justify-center">
                    <template x-if="prod.imagen">
                      <img :src="prod.imagen" :alt="prod.nombre" class="w-full h-full object-cover">
                    </template>
                    <template x-if="!prod.imagen">
                      <i class="fa-solid fa-box text-ink-300 text-sm"></i>
                    </template>
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-ink-800 truncate" x-text="prod.nombre"></p>
                    <p class="text-xs text-ink-400" x-text="prod.vendidos + ' unidades'"></p>
                  </div>
                  <span class="text-sm font-display font-700 text-ink-900" x-text="'S/' + prod.ingreso.toFixed(0)"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-2xl border border-ink-100 shadow-sm overflow-hidden hover-glow fade-up-d2">
          <div class="px-6 py-4 border-b border-ink-100 flex items-center justify-between">
            <h3 class="font-display font-700 text-ink-900">Últimas Ventas</h3>
            <button @click="navigateTo('lista-ventas')" class="text-brand-600 text-xs font-semibold hover:text-brand-700 transition-all hover:translate-x-1"><i class="fa-solid fa-arrow-right text-xs ml-1"></i> Ver todo</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead><tr class="tbl-head bg-ink-50"><th class="text-left">Boleta</th><th class="text-left">Cliente</th><th class="text-left">Canal</th><th class="text-left">Total</th><th class="text-left">Estado</th><th class="text-left">Fecha</th></tr></thead>
              <tbody>
                <template x-for="venta in ventas.slice(0, 5)" :key="venta.id">
                  <tr class="tbl-row cursor-pointer" @click="verVenta(venta)">
                    <td class="font-mono text-xs text-ink-500" x-text="venta.boleta_code || '#V-' + venta.id"></td>
                    <td class="font-medium text-ink-800" x-text="venta.cliente"></td>
                    <td><span class="badge" :class="venta.canal === 'Online' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'" x-text="venta.canal"></span></td>
                    <td class="font-display font-700 text-ink-900" x-text="'S/ ' + venta.total.toFixed(2)"></td>
                    <td><span class="badge" :class="adminVentaBadgeClass(venta.estado)" x-text="venta.estado"></span></td>
                    <td class="text-ink-400 text-xs" x-text="venta.fecha"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

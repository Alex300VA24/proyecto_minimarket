  <main class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-gradient-to-r from-brand-700 via-brand-600 to-brand-500 h-20 flex items-center px-8 gap-6 flex-shrink-0 shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center">
          <i class="fa-solid fa-store text-white text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="font-display font-800 text-white text-2xl tracking-tight" x-text="getPageTitle()"></h2>
            
          </div>
          <p class="text-white/60 text-xs font-medium tracking-wide">MINIMARKET YUMIS - PANEL ADMINISTRATIVO</p>
        </div>
      </div>
      <div class="ml-auto flex items-center gap-4">
        <div class="hidden md:flex items-center gap-2 text-white/60 text-xs">
          
        </div>
        <button @click="showModalNotificaciones = true; loadPedidos()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80 hover:text-white transition-all relative">
          <i class="fa-solid fa-bell text-lg"></i>
          <span x-show="pedidos.length > 0" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-white text-xs font-bold flex items-center justify-center" x-text="pedidos.length"></span>
        </button>
        <div class="w-px h-8 bg-white/20"></div>
        
        <div class="flex items-center gap-3 bg-white/10 backdrop-blur-sm rounded-xl px-4 py-2">
          <div class="w-9 h-9 rounded-full bg-accent-500 flex items-center justify-center text-white text-sm font-bold shadow-lg" x-text="initial"></div>
          <div class="hidden sm:block">
            <p class="text-sm font-semibold text-white" x-text="currentUser.nombre"></p>
            <p class="text-white/50 text-xs" x-text="currentUser.email"></p>
          </div>
        </div>
      </div>
    </header>

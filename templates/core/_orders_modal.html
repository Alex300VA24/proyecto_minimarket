{% load static %}
<!-- MODAL: Mis Pedidos -->
<div x-show="openOrders" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="openOrders = false; openOrderDetail = false; orderDetail = null" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl max-h-[85vh] overflow-y-auto" @click.stop>
    <template x-if="!openOrderDetail">
      <div>
        <div class="flex items-center justify-between p-4 border-b border-ink-100">
          <div>
            <h2 class="font-display font-800 text-xl text-ink-900">Mis Pedidos</h2>
            <p class="text-ink-400 text-sm mt-0.5">Historial de tus órdenes</p>
          </div>
          <button @click="openOrders = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400 hover:text-ink-600 transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-6">
          <template x-if="orders.length === 0">
            <div class="empty-state py-12">
              <i class="fa-regular fa-clock text-ink-300 text-5xl mb-4"></i>
              <h3 class="font-display font-700 text-lg text-ink-600">No tienes pedidos aún</h3>
              <p class="text-ink-400 mt-1 text-sm">Realiza tu primera compra en el catálogo.</p>
              <a href="{% url 'catalog' %}" class="btn-primary mt-4 text-sm inline-flex items-center gap-2"><i class="fa-solid fa-arrow-right"></i> Ir al catálogo</a>
            </div>
          </template>
          <div class="space-y-3" x-show="orders.length > 0">
            <template x-for="order in orders" :key="order.id">
              <div class="bg-ink-50 rounded-xl p-4">
                <div class="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <div class="flex items-center gap-3">
                      <h3 class="font-display font-700 text-ink-900" x-text="'Pedido #' + order.id"></h3>
                      <span class="badge" :class="orderBadgeClass(order.status)" x-text="order.status_display"></span>
                    </div>
                    <p class="text-xs text-ink-400 mt-1" x-text="order.date + ' · ' + order.items_count + ' producto(s)'"></p>
                    <div class="flex items-center gap-2 mt-1" x-show="order.boleta_code">
                      <span class="text-xs font-mono text-ink-500" x-text="order.boleta_code"></span>
                      <span x-show="order.is_paid" class="badge bg-green-100 text-green-700 text-[10px]">Pagado</span>
                      <span x-show="order.payment_method" class="badge bg-blue-100 text-blue-700 text-[10px]" x-text="order.payment_method"></span>
                    </div>
                  </div>
                  <div class="text-right">
                    <p class="font-display font-800 text-lg text-brand-600" x-text="'S/ ' + order.total.toFixed(2)"></p>
                    <div class="flex gap-2 mt-2">
                      <button @click="viewOrderDetail(order.id)" class="btn-ghost text-xs py-1.5 px-3"><i class="fa-regular fa-eye"></i> Ver detalle</button>
                      <button x-show="isOrderCancellable(order.status)" @click="cancelOrder(order.id)" class="btn-danger text-xs py-1.5 px-3"><i class="fa-solid fa-xmark"></i> Cancelar</button>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
    <template x-if="openOrderDetail && orderDetail">
      <div>
        <div class="flex items-center justify-between p-6 border-b border-ink-100">
          <div class="flex items-center gap-3">
            <button @click="openOrderDetail = false; orderDetail = null" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400 hover:text-ink-600 transition-colors"><i class="fa-solid fa-arrow-left"></i></button>
            <div>
              <h2 class="font-display font-800 text-xl text-ink-900" x-text="'Pedido #' + orderDetail.id"></h2>
              <p class="text-ink-400 text-sm mt-0.5" x-text="orderDetail.date"></p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="badge text-sm px-4 py-1.5" :class="orderBadgeClass(orderDetail.status)" x-text="orderDetail.status_display"></span>
            <button @click="openOrderDetail = false; orderDetail = null" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400 hover:text-ink-600 transition-colors"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        <div class="p-6">
          <div class="bg-ink-50 rounded-xl overflow-hidden mb-4">
            <table class="w-full">
              <thead>
                <tr class="tbl-head">
                  <th>Producto</th>
                  <th class="text-center">Cantidad</th>
                  <th class="text-right">Precio</th>
                  <th class="text-right">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in orderDetail.items" :key="item.name">
                  <tr class="tbl-row">
                    <td class="py-3">
                      <div class="flex items-center gap-3">
                        <template x-if="item.image">
                          <img :src="item.image" alt="Imagen" class="w-12 h-12 rounded-xl object-cover bg-white border border-ink-100">
                        </template>
                        <template x-if="!item.image">
                          <div class="w-12 h-12 rounded-xl bg-ink-100 flex items-center justify-center text-ink-400"><i class="fa-solid fa-box"></i></div>
                        </template>
                        <div class="min-w-0">
                          <p class="font-medium text-ink-900 text-sm truncate" x-text="item.name"></p>
                        </div>
                      </div>
                    </td>
                    <td class="text-center text-sm" x-text="item.quantity"></td>
                    <td class="text-right text-sm" x-text="'S/ ' + item.price.toFixed(2)"></td>
                    <td class="text-right font-display font-700 text-brand-600 text-sm" x-text="'S/ ' + item.subtotal.toFixed(2)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div x-show="orderDetail.boleta_code" class="bg-brand-50 rounded-xl p-4 mb-4 border border-brand-200">
            <div class="text-center mb-3" x-show="orderDetail.qr_base64">
              <div class="bg-white rounded-xl p-3 inline-block border border-ink-200">
                <img :src="'data:image/png;base64,' + orderDetail.qr_base64" alt="QR Boleta" class="w-32 h-32 mx-auto">
              </div>
            </div>
            <div class="flex items-center justify-between text-sm">
              <span class="text-ink-500">Boleta</span>
              <span class="font-mono font-semibold text-brand-700" x-text="orderDetail.boleta_code"></span>
            </div>
            <div class="flex items-center justify-between text-sm mt-1">
              <span class="text-ink-500">Método de pago</span>
              <span class="badge bg-blue-100 text-blue-700" x-text="orderDetail.payment_method || '—'"></span>
            </div>
            <div class="flex items-center justify-between text-sm mt-1">
              <span class="text-ink-500">Estado</span>
              <span x-show="orderDetail.is_paid" class="badge bg-green-100 text-green-700">Pagado</span>
              <span x-show="!orderDetail.is_paid" class="badge bg-yellow-100 text-yellow-700">Pendiente</span>
            </div>
            <div class="flex gap-2 mt-3">
              <a :href="'/boleta/' + orderDetail.boleta_code" target="_blank" class="btn-ghost flex-1 text-xs py-2"><i class="fa-solid fa-print"></i> Imprimir</a>
            </div>
          </div>
          <div class="flex items-center justify-between border-t border-ink-100 pt-4">
            <div x-show="orderDetail.notes">
              <p class="text-sm text-ink-500"><strong>Notas:</strong> <span x-text="orderDetail.notes"></span></p>
            </div>
            <div class="text-right ml-auto">
              <p class="text-sm text-ink-500">Total</p>
              <p class="font-display font-800 text-2xl text-ink-900" x-text="'S/ ' + orderDetail.total.toFixed(2)"></p>
            </div>
          </div>
          <div class="mt-4 flex gap-3" x-show="isOrderCancellable(orderDetail.status)">
            <button @click="cancelOrder(orderDetail.id); openOrderDetail = false; orderDetail = null" class="btn-danger"><i class="fa-solid fa-xmark"></i> Cancelar pedido</button>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

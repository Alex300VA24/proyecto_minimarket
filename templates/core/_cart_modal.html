{% load static %}
<!-- MODAL: Carrito -->
<div x-show="openCart" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="openCart = false" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" @click.stop>
    <div class="flex items-center justify-between p-6 border-b border-ink-100">
      <div>
        <h2 class="font-display font-800 text-xl text-ink-900">Tu Carrito</h2>
        <p class="text-ink-400 text-sm mt-0.5" x-text="cartItems.length + ' producto(s) en tu carrito'"></p>
      </div>
      <button @click="openCart = false" class="w-8 h-8 rounded-lg hover:bg-ink-100 flex items-center justify-center text-ink-400 hover:text-ink-600 transition-colors"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-6">
      <template x-if="cartItems.length === 0">
        <div class="empty-state py-12">
          <i class="fa-solid fa-cart-empty text-ink-300 text-5xl mb-4"></i>
          <h3 class="font-display font-700 text-lg text-ink-600">Tu carrito está vacío</h3>
          <p class="text-ink-400 mt-1 text-sm">Explora nuestro catálogo y agrega productos.</p>
          <a href="{% url 'catalog' %}" class="btn-primary mt-4 text-sm inline-flex items-center gap-2">Ir al catálogo <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </template>
      <template x-if="cartItems.length > 0">
        <div>
          <div class="space-y-3 mb-6">
            <template x-for="item in cartItems" :key="item.id">
              <div class="flex items-center gap-4 p-3 bg-ink-50 rounded-xl">
                <div class="w-12 h-12 rounded-lg bg-white flex items-center justify-center border border-ink-100 overflow-hidden">
                  <template x-if="item.image">
                    <img :src="item.image" :alt="item.name" class="w-full h-full object-contain">
                  </template>
                  <template x-if="!item.image">
                    <i class="fa-solid fa-cart-shopping text-brand-500"></i>
                  </template>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="font-medium text-ink-900 text-sm truncate" x-text="item.name"></p>
                  <p class="text-xs text-ink-400" x-text="'S/ ' + item.price.toFixed(2) + ' c/u'"></p>
                </div>
                <div class="flex items-center gap-2">
                  <button @click="if(item.quantity > 1) { item.quantity--; updateCartItem(item.id, item.quantity); }" class="qty-btn"><i class="fa-solid fa-minus text-xs"></i></button>
                  <span class="w-8 text-center font-display font-700 text-sm" x-text="item.quantity"></span>
                  <button @click="item.quantity++; updateCartItem(item.id, item.quantity)" class="qty-btn"><i class="fa-solid fa-plus text-xs"></i></button>
                </div>
                <span class="font-display font-700 text-brand-600 text-sm w-20 text-right" x-text="'S/ ' + (item.price * item.quantity).toFixed(2)"></span>
                <button @click="removeCartItem(item.id)" class="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 flex items-center justify-center text-red-500 hover:text-red-600 transition-colors flex-shrink-0">
                  <i class="fa-solid fa-xmark text-base"></i>
                </button>
              </div>
            </template>
          </div>
          <div class="border-t border-ink-100 pt-4">
            <div class="flex items-center justify-between mb-4">
              <button @click="emptyCart()" class="text-sm text-red-500 hover:text-red-700 transition-colors flex items-center gap-1.5"><i class="fa-solid fa-trash-can"></i> Vaciar carrito</button>
              <div>
                <p class="text-sm text-ink-500">Total</p>
                <p class="font-display font-800 text-2xl text-ink-900" x-text="'S/ ' + cartTotal.toFixed(2)"></p>
              </div>
            </div>
            <button @click="goToPayment()" class="btn-accent text-base py-3 px-8 w-full"><i class="fa-solid fa-cart-shopping"></i> Finalizar compra</button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>

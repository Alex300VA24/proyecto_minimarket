{% extends 'core/base.html' %}
{% load static %}

{% block title %}Contraseña restablecida — Minimarket Yumis{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md fade-up text-center">
    <div class="bg-white rounded-2xl shadow-lg border border-ink-100 p-8">
      <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-circle-check text-green-500 text-3xl"></i>
      </div>
      <h1 class="font-display font-800 text-2xl text-ink-900 mb-2">Contraseña restablecida</h1>

      <a href="{% url 'login' %}" class="btn-primary mt-6 inline-flex items-center gap-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar sesión
      </a>
    </div>
  </div>
</div>
{% endblock %}

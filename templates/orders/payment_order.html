{% extends 'core/base.html' %}
{% load static %}

{% block title %}Pago Pedido #{{ order.id }} — Minimarket Yumis{% endblock %}

{% block content %}
<div x-data="paymentOrderApp()" x-init="init()">

    {% include 'core/_navbar.html' %}

    <!-- Loading -->
    <template x-if="loading">
        <main class="max-w-md mx-auto px-4 py-20">
            <div class="text-center">
                <div class="w-20 h-20 rounded-full bg-brand-100 flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-spinner fa-spin text-brand-600 text-3xl"></i>
                </div>
                <h1 class="font-display font-800 text-2xl text-ink-900 mb-3">Cargando pedido...</h1>
            </div>
        </main>
    </template>

    <!-- Already Paid -->
    <template x-if="!loading && isPaid">
        <main class="max-w-md mx-auto px-4 py-20">
            <div class="text-center">
                <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-circle-check text-green-600 text-3xl"></i>
                </div>
                <h1 class="font-display font-800 text-2xl text-ink-900 mb-2">Pago confirmado</h1>
                <p class="text-ink-400 text-sm mb-6">Este pedido ya fue pagado exitosamente.</p>
                <a :href="'/boleta/' + boletaCode" class="btn-primary inline-flex items-center gap-2">
                    <i class="fa-solid fa-receipt"></i> Ver boleta
                </a>
            </div>
        </main>
    </template>

    <!-- Payment Screen -->
    <template x-if="!loading && !isPaid">
        <main class="max-w-md mx-auto px-4 py-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"
                     :class="paymentMethod === 'yape' ? 'bg-purple-100' : paymentMethod === 'plin' ? 'bg-blue-100' : 'bg-green-100'">
                    <i class="fa-solid text-2xl"
                       :class="paymentMethod === 'yape' ? 'fa-mobile-screen-button text-purple-600' : paymentMethod === 'plin' ? 'fa-wallet text-blue-600' : 'fa-university text-green-600'"></i>
                </div>
                <h1 class="font-display font-800 text-2xl text-ink-900 mb-1" x-text="'Pedido #' + orderId"></h1>
                <p class="text-ink-400 text-sm" x-text="paymentMethodDisplay"></p>
            </div>

            <!-- Order Summary -->
            <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-5 mb-6">
                <div class="space-y-3">
                    <template x-for="item in items" :key="item.name">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-ink-600" x-text="item.name + ' x' + item.quantity"></span>
                            <span class="font-display font-700 text-ink-900" x-text="'S/ ' + item.subtotal.toFixed(2)"></span>
                        </div>
                    </template>
                    <div class="border-t border-ink-100 pt-3 flex justify-between items-center">
                        <span class="font-display font-700 text-ink-900">Total</span>
                        <span class="font-display font-800 text-2xl text-brand-600" x-text="'S/ ' + total.toFixed(2)"></span>
                    </div>
                </div>
            </div>

            <!-- Yape: QR or Code Selection (only if no yape_type set) -->
            <template x-if="paymentMethod === 'yape' && !yapeType && !yapeChoice">
                <div class="space-y-3">
                    <p class="text-sm text-ink-500 text-center font-medium">¿Cómo deseas pagar con Yape?</p>
                    <button @click="yapeChoice = 'qr'" class="w-full flex items-center gap-3 px-5 py-4 rounded-xl bg-purple-600 text-white font-semibold text-sm transition-all hover:shadow-lg">
                        <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center">
                            <i class="fa-solid fa-qrcode text-lg"></i>
                        </div>
                        <div class="text-left">
                            <div>Escanear QR</div>
                            <div class="text-xs font-normal opacity-80">Usa la cámara para escanear</div>
                        </div>
                    </button>
                    <button @click="yapeChoice = 'code'" class="w-full flex items-center gap-3 px-5 py-4 rounded-xl bg-white border-2 border-purple-600 text-purple-600 font-semibold text-sm transition-all hover:bg-purple-50">
                        <div class="w-10 h-10 rounded-lg bg-purple-100 flex items-center justify-center">
                            <i class="fa-solid fa-key text-lg"></i>
                        </div>
                        <div class="text-left">
                            <div>Código de aprobación</div>
                            <div class="text-xs font-normal opacity-70">Ingresa código manualmente</div>
                        </div>
                    </button>
                </div>
            </template>

            <!-- Yape QR -->
            <template x-if="paymentMethod === 'yape' && (yapeType === 'qr' || yapeChoice === 'qr')">
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6 text-center">
                        <p class="text-sm text-ink-500 mb-4">Escanea este QR con la app de Yape</p>
                        <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-center">
                            <div class="w-48 h-48 bg-white border border-ink-200 rounded-lg flex items-center justify-center" x-show="simulationQrB64">
                                <img :src="'data:image/png;base64,' + simulationQrB64" alt="QR Yape" class="w-full h-full object-contain p-2">
                            </div>
                            <div class="w-48 h-48 bg-white border border-ink-200 rounded-lg flex items-center justify-center" x-show="!simulationQrB64">
                                <i class="fa-solid fa-qrcode text-ink-300 text-6xl"></i>
                            </div>
                        </div>
                    </div>
                    <a :href="simulationUrl" target="_blank" class="btn-primary w-full py-3 text-center block">
                        <i class="fa-solid fa-external-link-alt mr-2"></i> Abrir Simulación de Pago
                    </a>
                    <div class="text-center" x-show="!yapeType">
                        <button @click="yapeChoice = ''" class="text-sm text-ink-500 hover:text-ink-700 underline">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Volver
                        </button>
                    </div>
                </div>
            </template>

            <!-- Yape Code -->
            <template x-if="paymentMethod === 'yape' && (yapeType === 'code' || yapeChoice === 'code')">
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6">
                        <div class="bg-purple-50 rounded-xl p-4 mb-4">
                            <p class="text-sm text-ink-600"><strong>1.</strong> Abre la app de Yape</p>
                            <p class="text-sm text-ink-600"><strong>2.</strong> Realiza el pago por S/ <span x-text="total.toFixed(2)"></span></p>
                            <p class="text-sm text-ink-600"><strong>3.</strong> Ingresa el código de 6 dígitos que recibiste</p>
                        </div>

                        <!-- Generated Code Display -->
                        <div class="bg-purple-100 rounded-xl p-4 mb-4 text-center" x-show="generatedYapeCode">
                            <p class="text-xs text-purple-600 font-medium mb-1">Código generado</p>
                            <p class="text-3xl font-mono font-bold text-purple-700 tracking-[0.3em]" x-text="generatedYapeCode"></p>
                            <p class="text-xs text-purple-500 mt-1">Comparte este código con el vendedor</p>
                        </div>

                        <label class="block text-sm font-medium text-ink-700 mb-2">Ingresa el código de aprobación</label>
                        <input x-model="yapeCodeInput" type="text" class="w-full text-center text-2xl tracking-[0.3em] font-mono px-4 py-3 border border-ink-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none" placeholder="000000" maxlength="6">
                        <button @click="validateYapeCode()" class="btn-primary w-full mt-4 py-3" :disabled="yapeCodeInput.length < 6">
                            <i class="fa-solid fa-check mr-2"></i> Validar Código
                        </button>
                        <template x-if="codeError">
                            <p class="text-red-500 text-sm text-center mt-2">Código incorrecto. Intenta de nuevo.</p>
                        </template>
                    </div>
                    <div class="text-center" x-show="!yapeType">
                        <button @click="yapeChoice = ''" class="text-sm text-ink-500 hover:text-ink-700 underline">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Volver
                        </button>
                    </div>
                </div>
            </template>

            <!-- Yape QR (choice) -->
            <template x-if="paymentMethod === 'yape' && yapeChoice === 'qr'">
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6 text-center">
                        <p class="text-sm text-ink-500 mb-4">Escanea este QR con la app de Yape</p>
                        <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-center">
                            <div class="w-48 h-48 bg-white border border-ink-200 rounded-lg flex items-center justify-center" x-show="simulationQrB64">
                                <img :src="'data:image/png;base64,' + simulationQrB64" alt="QR Yape" class="w-full h-full object-contain p-2">
                            </div>
                            <div class="w-48 h-48 bg-white border border-ink-200 rounded-lg flex items-center justify-center" x-show="!simulationQrB64">
                                <i class="fa-solid fa-qrcode text-ink-300 text-6xl"></i>
                            </div>
                        </div>
                    </div>
                    <a :href="simulationUrl" target="_blank" class="btn-primary w-full py-3 text-center block">
                        <i class="fa-solid fa-external-link-alt mr-2"></i> Abrir Simulación de Pago
                    </a>
                    <div class="text-center">
                        <button @click="yapeChoice = ''" class="text-sm text-ink-500 hover:text-ink-700 underline">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Volver
                        </button>
                    </div>
                </div>
            </template>

            <!-- Yape Code -->
            <template x-if="paymentMethod === 'yape' && yapeChoice === 'code'">
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6">
                        <div class="bg-purple-50 rounded-xl p-4 mb-4">
                            <p class="text-sm text-ink-600"><strong>1.</strong> Abre la app de Yape</p>
                            <p class="text-sm text-ink-600"><strong>2.</strong> Realiza el pago por S/ <span x-text="total.toFixed(2)"></span></p>
                            <p class="text-sm text-ink-600"><strong>3.</strong> Ingresa el código de 6 dígitos</p>
                        </div>
                        <label class="block text-sm font-medium text-ink-700 mb-2">Código de aprobación</label>
                        <input x-model="yapeCodeInput" type="text" class="w-full text-center text-2xl tracking-[0.3em] font-mono px-4 py-3 border border-ink-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none" placeholder="000000" maxlength="6">
                        <button @click="validateYapeCode()" class="btn-primary w-full mt-4 py-3" :disabled="yapeCodeInput.length < 6">
                            <i class="fa-solid fa-check mr-2"></i> Validar Código
                        </button>
                        <template x-if="codeError">
                            <p class="text-red-500 text-sm text-center mt-2">Código incorrecto. Intenta de nuevo.</p>
                        </template>
                    </div>
                    <div class="text-center">
                        <button @click="yapeChoice = ''" class="text-sm text-ink-500 hover:text-ink-700 underline">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Volver
                        </button>
                    </div>
                </div>
            </template>

            <!-- Plin: QR Only -->
            <template x-if="paymentMethod === 'plin'">
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6 text-center">
                        <p class="text-sm text-ink-500 mb-4">Escanea este QR con la app de Plin</p>
                        <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-center">
                            <div class="w-48 h-48 bg-white border border-ink-200 rounded-lg flex items-center justify-center" x-show="simulationQrB64">
                                <img :src="'data:image/png;base64,' + simulationQrB64" alt="QR Plin" class="w-full h-full object-contain p-2">
                            </div>
                            <div class="w-48 h-48 bg-white border border-ink-200 rounded-lg flex items-center justify-center" x-show="!simulationQrB64">
                                <i class="fa-solid fa-qrcode text-ink-300 text-6xl"></i>
                            </div>
                        </div>
                    </div>
                    <a :href="simulationUrl" target="_blank" class="btn-primary w-full py-3 text-center block">
                        <i class="fa-solid fa-external-link-alt mr-2"></i> Abrir Simulación de Pago
                    </a>
                </div>
            </template>

            <!-- Transfer: Info Only -->
            <template x-if="paymentMethod.startsWith('transfer')">
                <div class="space-y-4">
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6">
                        <div class="bg-green-50 rounded-xl p-4 mb-4">
                            <p class="text-sm text-ink-600 font-semibold mb-2">Datos de transferencia</p>
                            <template x-if="transferBank === 'bcp'">
                                <div class="space-y-1 text-sm text-ink-600">
                                    <p><strong>Banco:</strong> BCP</p>
                                    <p><strong>Cuenta:</strong> 123-456-789</p>
                                    <p><strong>CCI:</strong> 002-123-45678901234-56</p>
                                    <p><strong>Titular:</strong> Minimarket Yumis SAC</p>
                                </div>
                            </template>
                            <template x-if="transferBank === 'interbank'">
                                <div class="space-y-1 text-sm text-ink-600">
                                    <p><strong>Banco:</strong> Interbank</p>
                                    <p><strong>Cuenta:</strong> 987-654-321</p>
                                    <p><strong>CCI:</strong> 003-987-65432101234-56</p>
                                    <p><strong>Titular:</strong> Minimarket Yumis SAC</p>
                                </div>
                            </template>
                        </div>
                        <div class="text-center">
                            <p class="text-ink-400 text-sm">Realiza la transferencia por el monto exacto</p>
                            <p class="font-display font-800 text-3xl text-brand-600 mt-2" x-text="'S/ ' + total.toFixed(2)"></p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-ink-200 p-6 text-center" x-show="simulationQrB64">
                        <p class="text-sm text-ink-500 mb-3">Escanea para abrir la simulación</p>
                        <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-center">
                            <div class="w-40 h-40 bg-white rounded-lg flex items-center justify-center">
                                <img :src="'data:image/png;base64,' + simulationQrB64" alt="QR simulación" class="w-full h-full object-contain p-2">
                            </div>
                        </div>
                    </div>
                    <a :href="simulationUrl" target="_blank" class="btn-primary w-full py-3 text-center block">
                        <i class="fa-solid fa-external-link-alt mr-2"></i> Simular Transferencia
                    </a>
                </div>
            </template>

            <!-- Status -->
            <div class="text-center mt-6">
                <div class="inline-flex items-center gap-2 px-4 py-2 bg-yellow-50 rounded-full">
                    <div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
                    <span class="text-sm text-yellow-700 font-medium">Esperando pago...</span>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-xs text-ink-400">El pago se detectará automáticamente</p>
            </div>
        </main>
    </template>
</div>
{% endblock %}

services:
  - type: web
    name: minimarket-yumis
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build && python manage.py collectstatic --noinput"
    startCommand: "gunicorn proyecto_minimarket.wsgi:application"
    releaseCommand: "python manage.py migrate"
    healthCheckPpath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        from_database:
          name: minimarket-yumis-db
          property: connectionString
      - key: SECRET_KEY
        generate_value: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "minimarket-yumis.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://minimarket-yumis.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

databases:
  - name: minimarket-yumis-db
    plan: free
    database_name: minimarket_yumis
    user: minimarket_yumis

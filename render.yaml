services:
  - type: web
    name: minimarket-yumis
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn proyecto_minimarket.wsgi:application"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: minimarket-yumis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: "minimarket-yumis.onrender.com,localhost,127.0.0.1,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://minimarket-yumis.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

databases:
  - name: minimarket-yumis-db
    plan: free
    databaseName: minimarket_yumis
    user: minimarket_yumis
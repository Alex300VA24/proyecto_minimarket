{% extends 'core/base.html' %}
{% load static %}

{% block title %}Plin - Minimarket Yumis{% endblock %}

{% block content %}
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #e5e5e5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .phone-frame { width: 375px; height: 812px; background: #fff; border-radius: 40px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15); position: relative; display: flex; flex-direction: column; }
    .status-bar { height: 44px; background: #00C853; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #fff; font-size: 14px; font-weight: 600; }
    .status-bar .time { font-size: 15px; }
    .status-bar .icons { display: flex; gap: 5px; align-items: center; }
    .status-bar .icons svg { width: 18px; height: 18px; fill: #fff; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .header .back-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
    .header .back-btn svg { width: 24px; height: 24px; stroke: #333; stroke-width: 2; fill: none; }
    .header .title { font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .content { flex: 1; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; overflow-y: auto; }
    .plin-logo { font-size: 40px; margin-bottom: 4px; }
    .plin-title { font-size: 22px; font-weight: 700; color: #00C853; margin-bottom: 6px; }
    .plin-subtitle { font-size: 13px; color: #999; margin-bottom: 40px; }
    .menu-btn { width: 100%; padding: 18px 16px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; transition: all 0.2s; border: none; text-decoration: none; }
    .menu-btn.qr { background: #00C853; color: #fff; }
    .menu-btn.qr:active { background: #00A843; }
    .menu-btn.pedidos { background: #fff; color: #555; border: 2px solid #e0e0e0; }
    .menu-btn.pedidos:active { background: #f5f5f5; }
    .menu-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .menu-btn.qr .menu-icon { background: rgba(255,255,255,0.2); }
    .menu-btn.pedidos .menu-icon { background: #f5f5f5; }
    .menu-text { text-align: left; }
    .menu-text small { display: block; font-size: 11px; font-weight: 400; opacity: 0.7; margin-top: 2px; }
    .nav-bar { height: 48px; background: #000; display: flex; align-items: center; justify-content: center; gap: 60px; flex-shrink: 0; }
    .nav-bar .nav-btn { width: 14px; height: 14px; background: #666; border-radius: 2px; }
    .nav-bar .nav-btn.circle { width: 16px; height: 16px; border-radius: 50%; }
    .nav-bar .nav-btn.triangle { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #666; background: transparent; border-radius: 0; }
</style>

<div class="phone-frame">
    <div class="status-bar">
        <span class="time">12:30</span>
        <div class="icons">
            <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </div>
    </div>

    <div class="header">
        <div class="back-btn">
            <a href="{% url 'payment_simulation:home' %}"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
        </div>
        <span class="title">Minimarket Yumis</span>
        <div class="back-btn">
            <a href="{% url 'payment_simulation:home' %}"><svg viewBox="0 0 24 24" style="stroke:#333;stroke-width:2;fill:none;width:24px;height:24px;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></a>
        </div>
    </div>

    <div class="content">
        <div class="plin-logo">💸</div>
        <div class="plin-title">Plin</div>
        <div class="plin-subtitle">Minimarket Yumis</div>

        <a href="{% url 'payment_simulation:plin_pedidos' %}?from=qr" class="menu-btn qr">
            <div class="menu-icon">📷</div>
            <div class="menu-text">
                Escanear QR
                <small>Abre la cámara para escanear</small>
            </div>
        </a>

        <a href="{% url 'payment_simulation:plin_pedidos' %}" class="menu-btn pedidos">
            <div class="menu-icon">📋</div>
            <div class="menu-text">
                Pedidos
                <small>Ver lista de pedidos pendientes</small>
            </div>
        </a>
    </div>

    <div class="nav-bar">
        <div class="nav-btn triangle"></div>
        <div class="nav-btn circle"></div>
        <div class="nav-btn"></div>
    </div>
</div>
{% endblock %}
